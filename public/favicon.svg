<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a3a" />
      <stop offset="100%" stop-color="#0a0918" />
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" />

  <!-- Outer Tech Circuit Hexagon -->
  <polygon points="50,12 85,32 85,68 50,88 15,68 15,32" stroke="url(#favGrad)" stroke-width="4" fill="none" />

  <!-- Inner Tech Symbol <E> -->
  <text x="50" y="60" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="900" font-family="monospace" letter-spacing="-1">
    &lt;E&gt;
  </text>

  <!-- Glowing Nodes -->
  <circle cx="85" cy="32" r="5" fill="#818cf8" />
  <circle cx="15" cy="68" r="5" fill="#f472b6" />
</svg>